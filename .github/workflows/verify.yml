name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  offline:
    name: Offline (không cần secret)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cài dependency
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in lib/*.mjs tests/*.mjs tools/*.mjs; do
            node --check "$f"
          done

      - name: Offline test (gate, model invariants, export contract)
        run: |
          node tests/offline.mjs
          node tests/attack-corpus.mjs

      - name: Calibration and metrics (offline)
        run: |
          node tests/benchmark.mjs
          node tests/metrics.mjs
          node tests/profiles.mjs
          node tests/trajectory.mjs
          node tools/trajectory-matrix.mjs --self-test
          node tests/budget.mjs
          node tests/context.mjs
          node tests/evidence.mjs
          node tests/provenance.mjs
          node tests/cost-governor.mjs
          node tests/jevgrep-control.mjs
          node tests/evidence-boundary.mjs

      - name: Không có secret hardcode trong source
        run: |
          # Loại .github/ vì chính file này chứa các pattern dưới dạng literal.
          if grep -rniE 'apikey_[a-f0-9]{16}|sk-[a-z0-9]{16}|github_pat_|ghp_[A-Za-z0-9]{20}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github \
               --include='*.mjs' --include='*.js' --include='*.json' --include='*.yml' --include='*.md' .; then
            echo "::error::Phát hiện chuỗi giống secret trong source"
            exit 1
          fi
          echo "Sạch — không có secret hardcode"

      - name: Không có path tuyệt đối cá nhân
        run: |
          if grep -rn '/home/' --include='*.mjs' --include='*.sh' lib tests verify.sh; then
            echo "::error::Có path tuyệt đối /home/... — phải dùng \$HOME hoặc homedir()"
            exit 1
          fi
          echo "Sạch — không có path tuyệt đối"

  dsh-compat:
    name: DSH compatibility (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: deployed
            version: 0.2.0-rc.2
          - host: latest-supported
            version: 0.2.0-rc.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm install --no-audit --no-fund
      - name: Install exact supported host
        run: npm install --global --no-audit --no-fund '@deepseek-ai/dsh@${{ matrix.version }}'
      - name: Strict real-host integration
        env:
          DSH_EXPECT_VERSION: ${{ matrix.version }}
        run: node tests/dsh-compat.mjs --strict

  dsh-master:
    name: DSH master (observational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm install --no-audit --no-fund
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: host-master
      - name: Build real master host packages
        working-directory: host-master
        run: |
          npm install --global pnpm@11.7.0
          pnpm install --frozen-lockfile
          pnpm run build:lib:host
      - name: Strict real-master integration
        env:
          DSH_HOST_PACKAGE: ${{ github.workspace }}/host-master/apps/cli/package.json
          DSH_COMPAT_MASTER: '1'
        run: |
          git -C host-master rev-parse HEAD
          node tests/dsh-compat.mjs --strict

  live:
    name: Live (cần TYPESAFE_API_KEY)
    runs-on: ubuntu-latest
    needs: offline
    # Chỉ chạy khi secret có mặt; fork PR không có secret nên job tự bỏ qua.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cài dependency
        run: npm install --no-audit --no-fund

      - name: Kiểm secret có mặt
        id: has_key
        run: |
          if [ -n "${{ secrets.TYPESAFE_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TYPESAFE_API_KEY chưa cấu hình — bỏ qua live check"
          fi

      - name: Live check (gọi Jev API thật)
        if: steps.has_key.outputs.present == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node tests/live-check.mjs
