name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  offline:
    name: Offline (không cần secret)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cài dependency
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in lib/*.mjs lib/control/*.mjs tests/*.mjs tools/*.mjs; do
            node --check "$f"
          done

      # §38: MỘT lệnh canonical duy nhất. CI không bảo trì danh sách suite riêng
      # nữa — nó gọi đúng `npm test`, nên không thể drift với verify.sh. Danh sách
      # thật nằm ở `package.json`; `tests/test-list-contract.mjs` (chạy trong npm
      # test) kiểm npm test == verify.sh == CI và bắt suite mồ côi.
      - name: Offline suite (canonical npm test)
        run: npm test

      - name: Không có secret hardcode trong source
        run: |
          # Loại .github/ vì chính file này chứa các pattern dưới dạng literal.
          if grep -rniE 'apikey_[a-f0-9]{16}|sk-[a-z0-9]{16}|github_pat_|ghp_[A-Za-z0-9]{20}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github \
               --include='*.mjs' --include='*.js' --include='*.json' --include='*.yml' --include='*.md' .; then
            echo "::error::Phát hiện chuỗi giống secret trong source"
            exit 1
          fi
          echo "Sạch — không có secret hardcode"

      - name: Không có path tuyệt đối cá nhân
        run: |
          if grep -rn '/home/' --include='*.mjs' --include='*.sh' lib tests verify.sh; then
            echo "::error::Có path tuyệt đối /home/... — phải dùng \$HOME hoặc homedir()"
            exit 1
          fi
          echo "Sạch — không có path tuyệt đối"

  dsh-compat:
    name: DSH supported release (0.2.0-rc.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm install --no-audit --no-fund
      - name: Install exact supported host
        run: npm install --global --no-audit --no-fund '@deepseek-ai/dsh@0.2.0-rc.2'
      - name: Strict real-host integration
        env:
          DSH_EXPECT_VERSION: '0.2.0-rc.2'
        run: node tests/dsh-compat.mjs --strict

  dsh-master:
    name: DSH master (observational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm install --no-audit --no-fund
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: host-master
      - name: Build real master host packages
        working-directory: host-master
        run: |
          npm install --global pnpm@11.7.0
          pnpm install --frozen-lockfile
          pnpm run build:lib:host
      - name: Strict real-master integration
        env:
          DSH_HOST_PACKAGE: ${{ github.workspace }}/host-master/apps/cli/package.json
          DSH_COMPAT_MASTER: '1'
        run: |
          git -C host-master rev-parse HEAD
          node tests/dsh-compat.mjs --strict

  live:
    name: Live Jev nightly smoke
    runs-on: ubuntu-latest
    needs: offline
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured smoke credential
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo '::error::TYPESAFE_API_KEY is missing; live API coverage was not executed'
            exit 1
          fi
      - name: Live check (one noul and one choice)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node tests/live-smoke.mjs
